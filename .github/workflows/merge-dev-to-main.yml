name: Auto Merge Claude Dev to Main

on:
  push:
    branches:
      - "claude/repo-indexing-study-0qfz64"

permissions:
  contents: write

concurrency:
  group: merge-claude-dev-to-main
  cancel-in-progress: false

jobs:
  merge-to-main:
    name: Merge dev branch into main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest branches
        run: |
          git fetch origin main
          git fetch origin "claude/repo-indexing-study-0qfz64"

      - name: Make sure main is latest
        run: |
          git checkout main
          git reset --hard origin/main

      - name: Merge dev into main
        run: |
          git merge \
            origin/claude/repo-indexing-study-0qfz64 \
            --no-ff \
            -m "Auto merge claude/repo-indexing-study-0qfz64 into main"

      - name: Push to main
        run: |
          git push origin main
