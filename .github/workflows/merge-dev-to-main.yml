name: Auto Merge Dev to Main

on:
  push:
    branches:
      - claude/asterisk-gui-stack-plan-lc1l65

permissions:
  contents: write

concurrency:
  group: auto-merge-dev-to-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch dev branch
        run: |
          git fetch origin claude/asterisk-gui-stack-plan-lc1l65

      - name: Merge dev into main
        run: |
          git merge origin/claude/asterisk-gui-stack-plan-lc1l65 --no-ff -m "Auto merge dev into main"

      - name: Push main
        run: |
          git push origin main
