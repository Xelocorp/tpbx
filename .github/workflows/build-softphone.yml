name: Build Windows Softphone

# Builds the XeloVoice Windows softphone installer (.exe) on windows-latest.
# Triggered manually, on a version tag, or when the desktop app changes on the
# dev branch. The installer is uploaded as a build artifact; tag builds also
# attach it to a GitHub Release. Deploy fetches or copies the artifact into the
# console's downloads dir (web/dist/downloads/) so the admin "Softphone for
# Windows" button (which links to /downloads/xelovoice-softphone-setup.exe) can
# serve it.

on:
  workflow_dispatch:
  push:
    tags:
      - "softphone-v*"
    branches:
      - "claude/repo-indexing-study-0qfz64"
    paths:
      - "desktop/**"
      - ".github/workflows/build-softphone.yml"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      # Build the native pjsua media sidecar (UDP/TCP/TLS audio) and vendor it
      # into resources/pjsua so electron-builder bundles it (see D2 in
      # docs/NATIVE_SOFTPHONE.md).
      - name: Build pjsua sidecar
        working-directory: desktop/native
        shell: pwsh
        env:
          PJ_VERSION: "2.14.1"
        run: ./build-pjsua-windows.ps1

      - name: Vendor sidecar into resources
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/pjsua | Out-Null
          Copy-Item native/out/* resources/pjsua/ -Force
          Get-ChildItem resources/pjsua | Format-Table Name,Length -AutoSize

      - name: Build and package (NSIS installer)
        working-directory: desktop
        # --publish never (in the dist script) and no token here mean
        # electron-builder packages only; artifact/release upload is handled by
        # the steps below.
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xelovoice-softphone-setup
          path: desktop/release/xelovoice-softphone-setup.exe
          if-no-files-found: error

      # Rolling "softphone-latest" release: keeps a stable tag pointed at the
      # newest build so the server's provision_softphone can always fetch the
      # current installer. Runs on non-tag (branch / manual) builds.
      - name: Publish rolling latest release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: softphone-latest
          name: Softphone (latest build)
          prerelease: true
          files: desktop/release/xelovoice-softphone-setup.exe

      # Versioned release: on a softphone-v* tag, attach the installer to that
      # tag's release.
      - name: Attach to tagged release
        if: startsWith(github.ref, 'refs/tags/softphone-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/xelovoice-softphone-setup.exe
