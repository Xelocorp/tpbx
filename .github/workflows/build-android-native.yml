name: Build Native Android

# Native (pjsua2) Android softphone build. Cross-compiles PJSIP + OpenSSL (via
# scripts/build-pjsip.sh, cached), vendors libpjsua2.so + libc++_shared.so and
# the generated pjsua2 Java bindings into the app module, then assembles a
# debug APK. See docs/NATIVE_SOFTPHONE.md.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/repo-indexing-study-0qfz64"
    paths:
      - "android-native/**"
      - ".github/workflows/build-android-native.yml"

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.3.11579264"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + swig
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;3.22.1" >/dev/null
          sudo apt-get update
          sudo apt-get install -y swig build-essential python3

      # PJSIP + OpenSSL take ~8min to compile; cache the outputs keyed on the
      # build script + toolchain so app iterations are fast.
      - name: Cache PJSIP outputs
        id: pjsip-cache
        uses: actions/cache@v4
        with:
          path: android-native/pjsip-out
          key: pjsip-${{ env.NDK_VERSION }}-${{ hashFiles('android-native/scripts/build-pjsip.sh') }}

      - name: Build PJSIP (arm64-v8a)
        if: steps.pjsip-cache.outputs.cache-hit != 'true'
        working-directory: android-native
        env:
          PJ_VERSION: "2.14.1"
          ABIS: "arm64-v8a"
          APP_PLATFORM: "android-24"
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          bash scripts/build-pjsip.sh

      - name: Vendor PJSIP into the app module
        working-directory: android-native
        run: |
          mkdir -p app/src/main/jniLibs app/src/main/java
          cp -r pjsip-out/jniLibs/* app/src/main/jniLibs/
          cp -r pjsip-out/java/* app/src/main/java/
          echo "== vendored native engine:"
          find app/src/main/jniLibs -type f | sed 's/^/   /'
          echo "   java bindings: $(find app/src/main/java/org/pjsip -name '*.java' | wc -l) files"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        working-directory: android-native
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xelovoice-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish as the Android download the console serves. This is the native
      # (pjsua2, UDP/TCP/TLS-with-audio) app the admin's "Softphone (Android)"
      # button hands out. Debug-signed for now; swap to a signed release once a
      # keystore is configured (see docs/ANDROID_NATIVE_SETUP.md).
      - name: Stage APK as xelovoice-softphone.apk
        run: cp android-native/app/build/outputs/apk/debug/app-debug.apk xelovoice-softphone.apk

      - name: Publish to softphone-latest release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: softphone-latest
          name: Softphone (latest build)
          prerelease: true
          files: xelovoice-softphone.apk
