; cel_odbc.conf  -- write Channel Event Log rows into PostgreSQL.
;
; Install as /etc/asterisk/cel_odbc.conf. CEL is finer-grained than CDR (every
; channel state transition) and powers detailed call-flow timelines in the GUI.
; Requires cel.conf to have [general] enable=yes and the ODBC backend loaded.

[tpbx]
connection=tpbx
table=cel
usegmtime=yes
alias eventtime => eventtime
