; extconfig.conf  -- maps Asterisk realtime families to database tables.
;
; The left side is the realtime family Asterisk asks for; the right side is
; "<odbc-context>,<table>" where odbc-context is the [tpbx] entry from
; res_odbc.conf. Install as /etc/asterisk/extconfig.conf.
;
; With these mappings in place, res_pjsip reads endpoints/auths/aors/etc from
; PostgreSQL, so the GUI provisions telephony by writing rows -- no .conf edits.

[settings]

; --- PJSIP objects (endpoints, trunks, extensions device side) ---
ps_endpoints       => odbc,tpbx,ps_endpoints
ps_auths           => odbc,tpbx,ps_auths
ps_aors            => odbc,tpbx,ps_aors
ps_contacts        => odbc,tpbx,ps_contacts
ps_endpoint_id_ips => odbc,tpbx,ps_endpoint_id_ips
ps_registrations   => odbc,tpbx,ps_registrations

; --- Dialplan (inbound/outbound routing) as realtime extensions ---
; The GUI writes routing logic into an `extensions` table that Asterisk reads
; via the "extensions" realtime family. (Table added in a later migration when
; Phase 6 / routing lands.)
; extensions       => odbc,tpbx,extensions
