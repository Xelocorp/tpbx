; ari.conf  -- Asterisk REST Interface, used by the GUI for live call control
; and the Stasis event WebSocket. Install as /etc/asterisk/ari.conf.
;
; ARI rides on Asterisk's HTTP server, so http.conf must have:
;     [general]
;     enabled=yes
;     bindaddr=127.0.0.1        ; keep ARI/AMI on localhost; the GUI proxies
;     bindport=8088
;
; Bind to 127.0.0.1 and let the TPBX backend (same host) be the only client.
; Never expose ARI directly to the internet.

[general]
enabled = yes
pretty = yes
allowed_origins = *

; password is injected by install.sh and matches TPBX_ARI_PASS.
[tpbx]
type = user
password = __ARI_PASSWORD__
password_format = plain
