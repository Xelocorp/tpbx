; cdr_adaptive_odbc.conf  -- write one CDR row per call into PostgreSQL.
;
; Install as /etc/asterisk/cdr_adaptive_odbc.conf. "adaptive" means Asterisk
; writes each CDR variable into the column of the same name in the target table
; and ignores variables with no matching column -- so the `cdr` table schema
; (migration 0002) defines what is stored.

[tpbx]
connection=tpbx        ; the [tpbx] context from res_odbc.conf
table=cdr
alias start => calldate ; map CDR "start" time to our calldate column
