; sorcery.conf  -- tells res_pjsip which objects come from realtime.
;
; Install as /etc/asterisk/sorcery.conf. Each line wires a PJSIP object type to
; the realtime family declared in extconfig.conf. Transports are intentionally
; absent: they stay in the static pjsip_transports.conf include.

[res_pjsip]
endpoint=realtime,ps_endpoints
auth=realtime,ps_auths
aor=realtime,ps_aors
domain_alias=realtime,ps_domain_aliases
contact=realtime,ps_contacts

[res_pjsip_endpoint_identifier_ip]
identify=realtime,ps_endpoint_id_ips

[res_pjsip_outbound_registration]
registration=realtime,ps_registrations
