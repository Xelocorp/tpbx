; cdr_pgsql.conf -- write one CDR row per call directly into PostgreSQL.
;
; Native libpq driver (no ODBC). cdr_pgsql reads the target table's columns and
; only inserts CDR variables that have a matching column, so the `cdr` table
; schema (migration 0002) defines what is stored.
;
; password is injected by install.sh.
[global]
hostname=127.0.0.1
port=5432
dbname=tpbx
user=tpbx
password=__DB_PASSWORD__
table=cdr
encoding=UTF8
