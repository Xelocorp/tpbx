; res_odbc.conf  -- ODBC connection Asterisk uses to reach PostgreSQL.
;
; Install on the Asterisk host as /etc/asterisk/res_odbc.conf (or include it).
; Requires: unixODBC + the PostgreSQL ODBC driver (psqlODBC), configured in
; /etc/odbcinst.ini and /etc/odbc.ini. See asterisk/README.md for the exact
; apt packages and the matching odbc.ini stanza.

; dsn must match a [tpbx-pg] section in /etc/odbc.ini.
; password is injected by install.sh (placeholder replaced at install time).
; Values are kept on their own lines with no trailing inline comments.
[tpbx]
enabled => yes
dsn => tpbx-pg
username => tpbx
password => __DB_PASSWORD__
pre-connect => yes
sanitysql => select 1
max_connections => 20
idlecheck => 3600
forcecommit => yes
