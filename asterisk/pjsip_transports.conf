; pjsip_transports.conf  -- managed PJSIP transports (UDP / TCP / TLS / WSS).
;
; Transports CANNOT live in realtime: PJSIP loads them once at module start,
; so they must be a static config file. This file is OWNED AND REWRITTEN by the
; TPBX GUI (Phase 4). Hand-edits will be overwritten -- change transports in the
; console. Include it from /etc/asterisk/pjsip.conf with:
;
;     #include "pjsip_transports.conf"
;
; After a change the GUI runs `pjsip reload` (transports themselves need a full
; Asterisk restart to fully re-bind, which the GUI will prompt for).

;=============================== UDP =================================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

;=============================== TCP =================================
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

;=============================== TLS =================================
; SIP over TLS. cert_file/priv_key_file are managed by the GUI's certificate
; store (Phase 4). Regenerate/replace via the console, not by hand.
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/tpbx.crt
priv_key_file=/etc/asterisk/keys/tpbx.key
; ca_list_file=/etc/asterisk/keys/ca.crt   ; enable for mutual-TLS trunks
method=tlsv1_2
; Public address for NAT traversal (set to the server's public IP/FQDN):
; external_media_address=pbx.example.com
; external_signaling_address=pbx.example.com

;=========================== WebRTC (WSS) ============================
; Secure WebSocket transport for browser/WebRTC softphones. Endpoints that use
; this transport must be provisioned with webrtc=yes (see ps_endpoints), which
; makes Asterisk enable ICE, DTLS-SRTP, AVPF and rtcp-mux automatically.
;
; IMPORTANT: a ws/wss PJSIP transport MUST NOT define its own `bind` -- the
; WebSocket rides on Asterisk's built-in HTTP(S) server (res_http_websocket).
; The listening socket is Asterisk's TLS HTTP listener, configured in
; http.conf (tlsenable=yes, tlsbindaddr=0.0.0.0:8089). Adding a bind here
; collides with that listener and breaks res_pjsip transport loading.
[transport-wss]
type=transport
protocol=wss
