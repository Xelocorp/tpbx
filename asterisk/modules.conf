; modules.conf -- REFERENCE ONLY.
;
; install.sh GENERATES the real /etc/asterisk/modules.conf dynamically
; (see write_modules_conf), preloading only the modules that actually exist on
; disk. Do NOT copy this file verbatim: preloading a module that is not
; installed (e.g. res_config_odbc.so on a build that lacks it) is FATAL and
; Asterisk will refuse to start.
;
; The intent, when the module is present:
;   autoload everything, but PRELOAD the native PostgreSQL realtime engine so it
;   is available BEFORE res_pjsip initializes. res_pjsip reads its
;   endpoints/auths/aors from realtime (sorcery -> res_config_pgsql). If
;   res_config_pgsql is not loaded when res_pjsip starts, res_pjsip fails to
;   initialize -- no SIP transports bind and no endpoints are visible.
;
[modules]
autoload = yes
preload = res_config_pgsql.so
; The legacy chan_sip stack must not load: everything here runs on res_pjsip,
; and if chan_sip is present it hijacks the WebSocket "sip" subprotocol and
; rejects WebRTC softphone REGISTERs ("Wrong password") because it cannot see
; the PJSIP realtime endpoints.
noload = chan_sip.so
