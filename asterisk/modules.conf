; modules.conf -- managed by TPBX.
;
; autoload everything as usual, but PRELOAD the ODBC realtime stack so it is
; available BEFORE res_pjsip initializes. This is the critical ordering:
; res_pjsip reads its endpoints/auths/aors from realtime (sorcery -> ODBC), and
; if res_config_odbc is not already loaded when res_pjsip starts, res_pjsip
; fails to initialize -- no SIP transports bind and no endpoints are visible.
;
[modules]
autoload = yes
preload = res_odbc.so
preload = res_config_odbc.so
