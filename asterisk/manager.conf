; manager.conf  -- Asterisk Manager Interface (AMI), used by the GUI for
; management events (PJSIP contacts, queues, `reload`). Install as
; /etc/asterisk/manager.conf.
;
; Keep AMI bound to localhost. The TPBX backend runs on the same host and is
; the only client that should ever connect.

[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1

[tpbx]
secret = __AMI_PASSWORD__   ; injected by install.sh; matches TPBX_AMI_PASS
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
; Read live state + call events; write reloads and originate.
read = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,message
write = system,call,agent,user,config,command,reporting,originate,message
