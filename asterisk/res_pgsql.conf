; res_pgsql.conf -- native PostgreSQL realtime driver (res_config_pgsql).
;
; This replaces the ODBC stack (res_odbc + unixODBC + odbc.ini): res_config_pgsql
; talks to PostgreSQL directly via libpq, so there is no driver manager, no DSN
; and no separate ODBC configuration. libpq negotiates scram-sha-256 natively.
;
; dbpass is injected by install.sh (placeholder replaced at install time).
[general]
dbhost=127.0.0.1
dbport=5432
dbname=tpbx
dbuser=tpbx
dbpass=__DB_PASSWORD__
