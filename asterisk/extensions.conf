; extensions.conf -- base dialplan (managed by TPBX).
;
; Endpoints created by the GUI use context=from-internal; trunks use from-trunk.
; The GUI compiles Outbound/Inbound routes into a generated include
; (/var/lib/tpbx/extensions_tpbx.conf) defining [tpbx-outbound]/[tpbx-inbound],
; which the contexts below include.
;
; Dialing convention (so internal calls never shadow outbound routes -- Asterisk
; checks a context's own extensions before its includes):
;   * internal extensions are 2-4 digit numbers  -> matched here directly
;   * outbound routes use a longer/prefixed pattern (e.g. dial 9 + number)
;     -> not matched here, so they fall through to the included tpbx-outbound

[from-internal]
; Echo / audio test.
exten => 600,1,NoOp(Echo test for ${CALLERID(num)})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Internal extension-to-extension calls (2-4 digit ids).
exten => _XX,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
exten => _XXX,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
exten => _XXXX,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; Outbound routes (generated).
include => tpbx-outbound

[from-trunk]
; Inbound routes from provider trunks (generated).
include => tpbx-inbound

; Generated routing contexts. Written by the GUI to the service's state dir so
; the unprivileged backend can rewrite it without touching /etc.
#include "/var/lib/tpbx/extensions_tpbx.conf"
