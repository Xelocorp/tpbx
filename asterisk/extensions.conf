; extensions.conf -- basic internal dialplan (managed by TPBX).
;
; Endpoints created by the GUI use context=from-internal by default. This gives
; them a minimal working dialplan so registered extensions can call each other
; and test audio, before the full routing UI (Phase 6) lands.

[from-internal]
; Echo test -- dial 600 to check your audio path (you should hear yourself).
exten => 600,1,NoOp(Echo test for ${CALLERID(num)})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Call another local extension by number (any numeric id, 2+ digits).
exten => _X.,1,NoOp(Internal call ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
